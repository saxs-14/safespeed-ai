services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/safespeed.db:/app/safespeed.db
    environment:
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000

  frontend:
    build: ./frontend
    ports:
      - "3000:5173"
    depends_on:
      - backend
