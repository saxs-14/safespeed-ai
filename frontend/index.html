<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16a34a" />
    <title>SafeSpeed AI — AI Traffic Speed Detection from Any Camera</title>
    <meta
      name="description"
      content="SafeSpeed AI turns any traffic camera into a speed-detection system. Upload footage and detect vehicles, track them across frames, and flag dangerous driving automatically."
    />
    <link rel="canonical" href="https://safespeed-ai-saxs-14s-projects.vercel.app/" />

    <!-- Static OG/Twitter tags: social-preview crawlers (Slack, Twitter, WhatsApp, LinkedIn)
         generally don't execute JS, so the per-route tags react-helmet-async injects at
         runtime (see Landing.tsx / Dashboard.tsx) aren't visible to them. These static
         tags are the fallback those crawlers actually see; Helmet's versions still apply
         for JS-executing crawlers (Google) and override these on route change. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SafeSpeed AI — AI Traffic Speed Detection from Any Camera" />
    <meta
      property="og:description"
      content="SafeSpeed AI turns any traffic camera into a speed-detection system. Upload footage and detect vehicles, track them across frames, and flag dangerous driving automatically."
    />
    <meta property="og:url" content="https://safespeed-ai-saxs-14s-projects.vercel.app/" />
    <meta property="og:image" content="https://safespeed-ai-saxs-14s-projects.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SafeSpeed AI — AI Traffic Speed Detection from Any Camera" />
    <meta
      name="twitter:description"
      content="SafeSpeed AI turns any traffic camera into a speed-detection system. Upload footage and detect vehicles, track them across frames, and flag dangerous driving automatically."
    />
    <meta name="twitter:image" content="https://safespeed-ai-saxs-14s-projects.vercel.app/og-image.png" />
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
